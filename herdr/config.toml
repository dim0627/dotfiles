onboarding = false

[ui.toast]
delivery = "system"

[ui]
status_indicators = "symbols"

[theme]
name = "vesper"
auto_switch = false

# Mirrors ~/.tmux.conf so muscle memory carries over.
[keys]
prefix = "ctrl+t"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux: v = split-window -h (side by side), s = split-window -v (stacked)
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
settings = "prefix+shift+s"

# tmux: T sets the pane label, "," renames the window
rename_pane = "prefix+shift+t"
rename_tab = "prefix+comma"

# tmux defaults
detach = "prefix+d"
close_tab = "prefix+ampersand"

# Vim-style workspace moves in navigate mode; j/k default to pane focus, so panes move to ctrl+j/k.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "ctrl+k"
navigate_pane_down = "ctrl+j"
